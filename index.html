<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
</head>
<body>
<script>
class Student {
    constructor(id, name, grades, attendance) {
        this.id = id;
        this.name = name;
        this.grades = grades;
        this.attendance = attendance;
    }

    // حساب المتوسط
    calculateAverage() {
        let sum = this.grades.reduce((total, grade) => total + grade, 0);
        return sum / this.grades.length;
    }

    // تحديد التقدير
    getGrade() {
        let average = this.calculateAverage();

        if (average >= 90) {
            return "A";
        } else if (average >= 80) {
            return "B";
        } else if (average >= 70) {
            return "C";
        } else if (average >= 60) {
            return "D";
        } else if (average >= 50) {
            return "E";
        } else {
            return "F";
        }
    }

    // النتيجة النهائية
    getResult() {
        if (this.calculateAverage() >= 50 && this.attendance >= 75) {
            return "ناجح";
        } else {
            return "يحتاج مراجعة";
        }
    }
}

// مصفوفة الطلاب الرئيسية
let studentsList = [
    new Student(1, "Ahmed", [90, 85, 95], 90),
    new Student(2, "Mona", [45, 48, 42], 80),
    new Student(3, "Ali", [70, 75, 80], 85),
    new Student(4, "Sara", [40, 45, 48], 70)
];

// استخراج الطلاب المتعثرين
let strugglingStudents = studentsList.filter(student => {
    let avg = student.calculateAverage();
    return avg >= 40 && avg <= 49;
});

// إضافة درجات الرأفة
let mercyGrades = strugglingStudents.map(student => {
    return {
        name: student.name,
        oldAverage: student.calculateAverage(),
        newAverage: student.calculateAverage() + 5
    };
});

// جمع المتوسطات الجديدة
let totalNewAverages = mercyGrades.reduce((total, student) => {
    return total + student.newAverage;
}, 0);

// حساب متوسط الرأفة مع الحماية من القسمة على صفر
let mercyAverage = mercyGrades.length > 0
    ? totalNewAverages / mercyGrades.length
    : 0;

// طباعة تقرير كل طالب
console.log("===== Students Report =====");

studentsList.forEach(student => {
    console.log("Name:", student.name);
    console.log("Average:", student.calculateAverage());
    console.log("Grade:", student.getGrade());
    console.log("Result:", student.getResult());
    console.log("--------------------");
});

// طباعة الطلاب المتعثرين بعد الرأفة
console.log("===== Mercy Students =====");
console.log(mercyGrades);

// طباعة متوسط الرأفة
console.log("Mercy Average:", mercyAverage);
</script>
</body>
</html>
